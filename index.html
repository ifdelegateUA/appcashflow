<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Органайзер">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Органайзер</title>
<style>
/* VOICE: спокійний особистий планер, без зайвого
   IDEA: паперовий щоденник — сітка місяця, касова книга, аркуші нотаток
   PICTURE: сама робоча поверхня — календар, баланс, список
   COLOUR and TYPE: білий/графіт, синій як основний, томатний акцент; системний шрифт (офлайн)
   LAYOUT: одна колонка, нижні вкладки, аркуші-форми знизу */
:root{--bg:#fff;--card:#f4f5f7;--ink:#17191d;--mute:#6b7079;--line:#e3e5e9;--pri:#2457d6;--pri-ink:#fff;--acc:#e5484d;--inc:#1f8a5b;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
@media(prefers-color-scheme:dark){:root{--bg:#121418;--card:#1d2026;--ink:#eef0f3;--mute:#9aa0aa;--line:#2b2f37;--pri:#6f95ff;--pri-ink:#0d1020;--acc:#ff6b6f;--inc:#4cc38a}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-top:var(--safe-t)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em}
h2{font-size:18px;margin:22px 0 10px}
main{padding:0 18px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}
section{display:none}section.on{display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.btn{min-height:44px;padding:0 18px;border-radius:12px;background:var(--pri);color:var(--pri-ink);font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.danger{background:transparent;color:var(--acc)}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon svg{width:24px;height:24px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.mute{color:var(--mute)}
.small{font-size:13px}
.card{background:var(--card);border-radius:16px;padding:14px 16px}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:10}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:12px;color:var(--mute)}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--pri)}
/* calendar */
.mhead{display:flex;align-items:center;gap:4px;margin:6px 0 8px}
.mhead b{font-size:20px;flex:1}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.wd{font-size:12px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1/1;max-height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;position:relative}
.day.out{visibility:hidden}
.day.today{color:var(--acc);font-weight:700}
.day.sel{background:var(--pri);color:var(--pri-ink);font-weight:700}
.day i{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--pri)}
.day.sel i{background:var(--pri-ink)}
.list{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.ev .t{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;white-space:nowrap}
.ev .b{flex:1}
.ev .n{font-size:14px;color:var(--mute);white-space:pre-wrap}
.tag{display:table;font-size:12px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri);margin-top:4px}
.empty{color:var(--mute);padding:14px 2px}
/* budget */
.bal{font-size:clamp(34px,10vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.two .card b{display:block;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.inc{color:var(--inc)}.exp{color:var(--acc)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:15px}
.bar .tr{grid-column:1/-1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar .tr span{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.tx .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
/* notes */
.search{width:100%;min-height:44px;border-radius:12px;border:0;background:var(--card);padding:0 14px;font-size:16px}
.note{display:block;width:100%;text-align:left}
.note b{display:block}
.note p{margin:4px 0 0;color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* fab */
.fab{position:fixed;right:18px;bottom:calc(76px + var(--safe-b));width:58px;height:58px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:9}
.fab svg{width:28px;height:28px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 18px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .25s ease;z-index:21;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:4px 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.f{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px;appearance:none;-webkit-appearance:none}
textarea.f{min-height:110px;resize:vertical}
.notebody{min-height:46vh!important}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:12px;padding:3px}
.seg button{min-height:40px;border-radius:10px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acts .btn{flex:1}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 60%,transparent);outline-offset:2px}
/* toast */
#toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;max-width:92vw;z-index:30;transition:transform .25s;font-weight:500}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1 id="ttl">Календар</h1><button class="icon" id="setBtn" aria-label="Налаштування"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>

<main>
<section id="cal" class="on">
  <div class="mhead">
    <button class="icon" id="mPrev" aria-label="Попередній місяць"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <b id="mName"></b>
    <button class="btn ghost" id="mToday" style="min-height:36px;padding:0 12px">Сьогодні</button>
    <button class="icon" id="mNext" aria-label="Наступний місяць"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="grid" id="grid"></div>
  <h2 id="dayTtl"></h2>
  <div class="list" id="dayList"></div>
  <h2>Найближчі</h2>
  <div class="list" id="upList"></div>
</section>

<section id="bud">
  <div class="mhead">
    <button class="icon" id="bPrev" aria-label="Попередній місяць"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <b id="bName"></b>
    <button class="icon" id="bNext" aria-label="Наступний місяць"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="mute small">Залишок за місяць</div>
  <div class="bal" id="bal"></div>
  <div class="two">
    <div class="card"><span class="mute small">Доходи</span><b class="inc" id="sInc"></b></div>
    <div class="card"><span class="mute small">Витрати</span><b class="exp" id="sExp"></b></div>
  </div>
  <div class="mute small" style="margin-top:8px" id="total"></div>
  <h2>Витрати за категоріями</h2>
  <div class="list" id="cats"></div>
  <h2>Операції</h2>
  <div class="list" id="txList"></div>
</section>

<section id="not">
  <input class="search" id="q" type="search" placeholder="Пошук у нотатках" autocomplete="off">
  <div class="list" id="noteList" style="margin-top:12px"></div>
</section>
</main>

<button class="fab" id="fab" aria-label="Додати"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav>
  <button class="on" data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календар</button>
  <button data-tab="bud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10h19M16 15h2"/></svg>Бюджет</button>
  <button data-tab="not"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>Нотатки</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast" role="status"></div>

<script>
{
const KEY='organizer.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MONTHS_G=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const WDL=['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
const REM={none:'Без нагадування',0:'У момент події',5:'За 5 хв',15:'За 15 хв',30:'За 30 хв',60:'За 1 год',120:'За 2 год',1440:'За 1 день'};
const CAT_E=['Продукти','Кафе і ресторани','Транспорт','Житло','Комунальні','Звʼязок та інтернет','Здоровʼя','Одяг','Розваги','Подарунки','Освіта','Інше'];
const CAT_I=['Зарплата','Підробіток','Подарунок','Повернення боргу','Інше'];
const money=new Intl.NumberFormat('uk-UA',{style:'currency',currency:'UAH',maximumFractionDigits:2});
const fm=v=>money.format(v);

let db={events:[],tx:[],notes:[]};
try{const raw=localStorage.getItem(KEY);if(raw)db=Object.assign(db,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Не вдалося зберегти дані')}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

let tab='cal';
const today=()=>ymd(new Date());
let calM=new Date();calM.setDate(1);
let sel=today();
let budM=new Date();budM.setDate(1);

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),3200)}

/* ---------- sheet ---------- */
let onClose=null;
function openSheet(html,closeCb){$('#sheetBody').innerHTML=html;onClose=closeCb||null;$('#scrim').classList.add('on');$('#sheet').classList.add('on')}
function closeSheet(){if(onClose){const f=onClose;onClose=null;f()}$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')}
$('#scrim').addEventListener('click',closeSheet);

/* ---------- tabs ---------- */
const TT={cal:'Календар',bud:'Бюджет',not:'Нотатки'};
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  tab=b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===tab));
  $('#ttl').textContent=TT[tab];window.scrollTo(0,0);
}));
$('#fab').addEventListener('click',()=>{if(tab==='cal')eventForm();else if(tab==='bud')txForm();else noteForm()});

/* ---------- calendar ---------- */
const dayLabel=s=>{const d=parseYmd(s);return d.getDate()+' '+MONTHS_G[d.getMonth()]+', '+WDL[d.getDay()]};
const evSort=(a,b)=>(a.date+(a.time||'00:00')).localeCompare(b.date+(b.time||'00:00'));
function evItem(e,showDate){
  const when=(showDate?dayLabel(e.date).split(',')[0]+' ':'')+(e.time||'');
  return `<button class="card ev" data-ev="${esc(e.id)}"><span class="t">${esc(when||'Весь день')}</span><span class="b"><b>${esc(e.title)}</b>${e.note?`<div class="n">${esc(e.note)}</div>`:''}${e.remind!=='none'?`<span class="tag">${esc(REM[e.remind]||'')}</span>`:''}</span></button>`;
}
function renderCal(){
  const y=calM.getFullYear(),m=calM.getMonth();
  $('#mName').textContent=MONTHS[m]+' '+y;
  const off=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const has=new Set(db.events.map(e=>e.date));const t=today();
  let h=WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<off;i++)h+='<div class="day out"></div>';
  for(let d=1;d<=dim;d++){const s=y+'-'+pad(m+1)+'-'+pad(d);
    h+=`<button class="day${s===t?' today':''}${s===sel?' sel':''}" data-d="${s}" aria-label="${dayLabel(s)}">${d}${has.has(s)?'<i></i>':''}</button>`}
  $('#grid').innerHTML=h;
  $('#dayTtl').textContent=sel===t?'Сьогодні, '+dayLabel(sel):dayLabel(sel);
  const dl=db.events.filter(e=>e.date===sel).sort(evSort);
  $('#dayList').innerHTML=dl.length?dl.map(e=>evItem(e,false)).join(''):'<div class="empty">Подій немає. Натисніть «+», щоб додати.</div>';
  const now=today();const up=db.events.filter(e=>e.date>=now).sort(evSort).slice(0,6);
  $('#upList').innerHTML=up.length?up.map(e=>evItem(e,true)).join(''):'<div class="empty">Немає запланованих подій.</div>';
}
$('#grid').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b){sel=b.dataset.d;renderCal()}});
$('#mPrev').addEventListener('click',()=>{calM.setMonth(calM.getMonth()-1);renderCal()});
$('#mNext').addEventListener('click',()=>{calM.setMonth(calM.getMonth()+1);renderCal()});
$('#mToday').addEventListener('click',()=>{calM=new Date();calM.setDate(1);sel=today();renderCal()});
$('#cal').addEventListener('click',e=>{const b=e.target.closest('[data-ev]');if(b)eventForm(db.events.find(x=>x.id===b.dataset.ev))});

function eventForm(ev){
  const e=ev||{id:'',title:'',date:sel,time:'',remind:'15',note:''};
  openSheet(`<h3>${ev?'Подія':'Нова подія'}</h3>
  <label for="eT">Назва</label><input class="f" id="eT" value="${esc(e.title)}" placeholder="Наприклад, лікар">
  <div class="two" style="margin-top:0"><div><label for="eD">Дата</label><input class="f" type="date" id="eD" value="${esc(e.date)}"></div>
  <div><label for="eH">Час</label><input class="f" type="time" id="eH" value="${esc(e.time)}"></div></div>
  <label for="eR">Нагадування</label><select class="f" id="eR">${Object.entries(REM).map(([k,v])=>`<option value="${k}"${String(e.remind)===k?' selected':''}>${v}</option>`).join('')}</select>
  <label for="eN">Примітка</label><textarea class="f" id="eN" placeholder="Необовʼязково">${esc(e.note)}</textarea>
  <div class="acts"><button class="btn" id="eSave">Зберегти</button><button class="btn ghost" id="eCancel">Скасувати</button></div>
  ${ev?`<div class="acts"><button class="btn ghost" id="eIcs">Додати в Календар iPhone</button><button class="btn danger" id="eDel">Видалити</button></div>
  <p class="mute small">«Календар iPhone» створює подію з системним нагадуванням, яке спрацює, навіть коли застосунок закрито.</p>`:''}`);
  $('#eCancel').onclick=closeSheet;
  $('#eSave').onclick=()=>{
    const title=$('#eT').value.trim(),date=$('#eD').value;
    if(!title){$('#eT').focus();toast('Вкажіть назву');return}
    if(!date){toast('Вкажіть дату');return}
    const time=$('#eH').value;let remind=$('#eR').value;
    if(remind!=='none'&&!time&&remind!=='1440')remind='0';
    const n={id:e.id||uid(),title,date,time,remind,note:$('#eN').value.trim(),fired:false};
    if(ev)Object.assign(ev,n);else db.events.push(n);
    save();sel=date;const d=parseYmd(date);calM=new Date(d.getFullYear(),d.getMonth(),1);
    closeSheet();renderCal();checkReminders(true);
    if(remind!=='none'&&'Notification'in window&&Notification.permission==='default')askNotify();
  };
  if(ev){
    $('#eDel').onclick=()=>{if(!confirm('Видалити подію?'))return;db.events=db.events.filter(x=>x.id!==ev.id);save();closeSheet();renderCal()};
    $('#eIcs').onclick=()=>exportIcs(ev);
  }
  if(!ev)setTimeout(()=>$('#eT').focus(),250);
}

/* reminders */
function fireAt(e){
  if(e.remind==='none')return null;
  const [h,mi]=(e.time||'09:00').split(':').map(Number);
  const d=parseYmd(e.date);d.setHours(h,mi,0,0);
  return d.getTime()-Number(e.remind)*60000;
}
function notify(title,body){
  toast('🔔 '+title+(body?' — '+body:''));
  try{if('Notification'in window&&Notification.permission==='granted'){
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-512.png'})).catch(()=>{});
    else new Notification(title,{body});
  }}catch(e){}
}
function checkReminders(silent){
  const now=Date.now();let ch=false;
  for(const e of db.events){
    const t=fireAt(e);if(t===null)continue;
    if(t>now){if(e.fired){e.fired=false;ch=true}continue}
    if(e.fired)continue;
    e.fired=true;ch=true;
    const start=t+Number(e.remind)*60000;
    if(!silent&&now-start<6*3600000)notify(e.title,(e.time?e.time+', ':'')+dayLabel(e.date));
  }
  if(ch)save();
}
function askNotify(){
  if(!('Notification'in window)){toast('Сповіщення доступні тільки в застосунку з головного екрана');return}
  Notification.requestPermission().then(p=>toast(p==='granted'?'Сповіщення увімкнено':'Сповіщення не дозволено')).catch(()=>{});
}
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function exportIcs(e){
  const d=e.date.replace(/-/g,'');const st=new Date();
  const stamp=st.getUTCFullYear()+pad(st.getUTCMonth()+1)+pad(st.getUTCDate())+'T'+pad(st.getUTCHours())+pad(st.getUTCMinutes())+'00Z';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Organizer//UK','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+e.id+'@organizer','DTSTAMP:'+stamp];
  if(e.time){const t=e.time.replace(':','')+'00';const end=parseYmd(e.date);const [h,m]=e.time.split(':').map(Number);end.setHours(h,m+30);
    L.push('DTSTART:'+d+'T'+t,'DTEND:'+ymd(end).replace(/-/g,'')+'T'+pad(end.getHours())+pad(end.getMinutes())+'00')}
  else{const n=parseYmd(e.date);n.setDate(n.getDate()+1);L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+ymd(n).replace(/-/g,''))}
  L.push('SUMMARY:'+icsEsc(e.title));if(e.note)L.push('DESCRIPTION:'+icsEsc(e.note));
  if(e.remind!=='none'){const mins=e.time?Number(e.remind):(e.remind==='1440'?15*60:-9*60);
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'TRIGGER:'+(mins<0?'PT'+(-mins)+'M':'-PT'+mins+'M'),'END:VALARM')}
  L.push('END:VEVENT','END:VCALENDAR');
  const blob=new Blob([L.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.rel='noopener';
  if(!/iPhone|iPad|iPod/.test(navigator.userAgent))a.download=(e.title||'event')+'.ics';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* ---------- budget ---------- */
const mKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
function renderBud(){
  const k=mKey(budM);$('#bName').textContent=MONTHS[budM.getMonth()]+' '+budM.getFullYear();
  const list=db.tx.filter(t=>t.date.slice(0,7)===k).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  let inc=0,exp=0;const by={};
  for(const t of list){if(t.type==='inc')inc+=t.amount;else{exp+=t.amount;by[t.cat]=(by[t.cat]||0)+t.amount}}
  const b=inc-exp;$('#bal').textContent=fm(b);$('#bal').className='bal'+(b<0?' exp':'');
  $('#sInc').textContent=fm(inc);$('#sExp').textContent=fm(exp);
  let all=0;for(const t of db.tx)all+=t.type==='inc'?t.amount:-t.amount;
  $('#total').textContent='Загальний баланс за весь час: '+fm(all);
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);const mx=cats.length?cats[0][1]:1;
  $('#cats').innerHTML=cats.length?cats.map(([c,v])=>`<div class="bar"><span>${esc(c)} <span class="mute small">${Math.round(v/exp*100)}%</span></span><span class="v">${fm(v)}</span><div class="tr"><span style="width:${(v/mx*100).toFixed(1)}%"></span></div></div>`).join(''):'<div class="empty">Витрат цього місяця ще немає.</div>';
  $('#txList').innerHTML=list.length?list.map(t=>`<button class="card tx" data-tx="${esc(t.id)}"><span class="sp"><b>${esc(t.cat)}</b><div class="mute small">${esc(dayLabel(t.date).split(',')[0])}${t.note?' · '+esc(t.note):''}</div></span><span class="v ${t.type==='inc'?'inc':'exp'}">${t.type==='inc'?'+':'−'}${fm(t.amount)}</span></button>`).join(''):'<div class="empty">Операцій немає. Натисніть «+», щоб додати дохід чи витрату.</div>';
}
$('#bPrev').addEventListener('click',()=>{budM.setMonth(budM.getMonth()-1);renderBud()});
$('#bNext').addEventListener('click',()=>{budM.setMonth(budM.getMonth()+1);renderBud()});
$('#txList').addEventListener('click',e=>{const b=e.target.closest('[data-tx]');if(b)txForm(db.tx.find(x=>x.id===b.dataset.tx))});

function txForm(tx){
  const cur=mKey(budM)===mKey(new Date())?today():mKey(budM)+'-01';
  const t=tx||{id:'',type:'exp',amount:'',cat:CAT_E[0],date:cur,note:''};
  let type=t.type;
  const opts=()=>(type==='inc'?CAT_I:CAT_E).map(c=>`<option${c===t.cat?' selected':''}>${esc(c)}</option>`).join('');
  openSheet(`<h3>${tx?'Операція':'Нова операція'}</h3>
  <div class="seg" id="tType"><button data-t="exp" class="${type==='exp'?'on':''}">Витрата</button><button data-t="inc" class="${type==='inc'?'on':''}">Дохід</button></div>
  <label for="tA">Сума, ₴</label><input class="f" id="tA" inputmode="decimal" placeholder="0" value="${t.amount===''?'':esc(String(t.amount).replace('.',','))}" style="font-size:24px;font-weight:600">
  <label for="tC">Категорія</label><select class="f" id="tC">${opts()}</select>
  <label for="tD">Дата</label><input class="f" type="date" id="tD" value="${esc(t.date)}">
  <label for="tN">Коментар</label><input class="f" id="tN" value="${esc(t.note)}" placeholder="Необовʼязково">
  <div class="acts"><button class="btn" id="tSave">Зберегти</button><button class="btn ghost" id="tCancel">Скасувати</button></div>
  ${tx?'<div class="acts"><button class="btn danger" id="tDel">Видалити операцію</button></div>':''}`);
  $('#tType').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;type=b.dataset.t;
    document.querySelectorAll('#tType button').forEach(x=>x.classList.toggle('on',x===b));$('#tC').innerHTML=opts()};
  $('#tCancel').onclick=closeSheet;
  $('#tSave').onclick=()=>{
    const amount=Math.round(parseFloat($('#tA').value.replace(/\s/g,'').replace(',','.'))*100)/100;
    if(!(amount>0)){$('#tA').focus();toast('Вкажіть суму більше нуля');return}
    const date=$('#tD').value||today();
    const n={id:t.id||uid(),type,amount,cat:$('#tC').value,date,note:$('#tN').value.trim(),ts:t.ts||Date.now()};
    if(tx)Object.assign(tx,n);else db.tx.push(n);
    save();const d=parseYmd(date);budM=new Date(d.getFullYear(),d.getMonth(),1);closeSheet();renderBud();
  };
  if(tx)$('#tDel').onclick=()=>{if(!confirm('Видалити операцію?'))return;db.tx=db.tx.filter(x=>x.id!==tx.id);save();closeSheet();renderBud()};
  if(!tx)setTimeout(()=>$('#tA').focus(),250);
}

/* ---------- notes ---------- */
function renderNotes(){
  const q=$('#q').value.trim().toLowerCase();
  const list=db.notes.filter(n=>!q||(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>b.upd-a.upd);
  $('#noteList').innerHTML=list.length?list.map(n=>{const d=new Date(n.upd);
    return `<button class="card note" data-n="${esc(n.id)}"><b>${esc(n.title||n.body.split('\n')[0]||'Без назви')}</b><p>${esc(n.body)}</p><div class="mute small" style="margin-top:6px">${d.getDate()} ${MONTHS_G[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}</div></button>`}).join('')
    :`<div class="empty">${q?'Нічого не знайдено.':'Нотаток поки немає. Натисніть «+», щоб створити.'}</div>`;
}
$('#q').addEventListener('input',renderNotes);
$('#noteList').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b)noteForm(db.notes.find(x=>x.id===b.dataset.n))});

function noteForm(note){
  let n=note,deleted=false;
  const store=()=>{
    if(deleted)return;
    const title=$('#nT').value.trim(),body=$('#nB').value;
    if(!n){if(!title&&!body.trim())return;n={id:uid(),title:'',body:'',upd:0};db.notes.push(n)}
    if(n.title===title&&n.body===body)return;
    n.title=title;n.body=body;n.upd=Date.now();save();
  };
  openSheet(`<input class="f" id="nT" placeholder="Заголовок" value="${esc(n?n.title:'')}" style="font-size:20px;font-weight:700;border:0;background:transparent;padding-left:0">
  <textarea class="f notebody" id="nB" placeholder="Текст нотатки">${esc(n?n.body:'')}</textarea>
  <div class="acts"><button class="btn" id="nDone">Готово</button>${n?'<button class="btn danger" id="nDel">Видалити</button>':''}</div>
  <p class="mute small">Зберігається автоматично.</p>`,()=>{store();renderNotes()});
  let tm;const auto=()=>{clearTimeout(tm);tm=setTimeout(store,600)};
  $('#nT').oninput=auto;$('#nB').oninput=auto;
  $('#nDone').onclick=closeSheet;
  if(n)$('#nDel').onclick=()=>{if(!confirm('Видалити нотатку?'))return;deleted=true;clearTimeout(tm);db.notes=db.notes.filter(x=>x.id!==n.id);save();closeSheet()};
  if(!n)setTimeout(()=>$('#nB').focus(),250);
}

/* ---------- settings / backup ---------- */
$('#setBtn').addEventListener('click',()=>{
  const perm='Notification'in window?Notification.permission:'unsupported';
  openSheet(`<h3>Налаштування</h3>
  <div class="card"><b>Сповіщення</b><p class="mute small" style="margin:4px 0 10px">Спрацьовують, коли застосунок відкритий або щойно був відкритий. Для гарантованих нагадувань відкрийте подію й натисніть «Додати в Календар iPhone».</p>
  <button class="btn ghost" id="sNot">${perm==='granted'?'Сповіщення увімкнено':perm==='unsupported'?'Доступно після встановлення на головний екран':'Увімкнути сповіщення'}</button></div>
  <div class="card" style="margin-top:12px"><b>Резервна копія</b><p class="mute small" style="margin:4px 0 10px">Усі дані зберігаються тільки на цьому телефоні. Час від часу зберігайте копію у «Файли», щоб нічого не втратити.</p>
  <div class="acts" style="margin-top:0"><button class="btn ghost" id="sExp">Зберегти копію</button><label class="btn ghost" style="display:grid;place-items:center;margin:0;color:var(--ink);font-size:16px">Відновити<input type="file" id="sImp" accept=".json,application/json" hidden></label></div></div>
  <p class="mute small">Подій: ${db.events.length} · Операцій: ${db.tx.length} · Нотаток: ${db.notes.length}</p>
  <div class="acts"><button class="btn" id="sClose">Закрити</button></div>`);
  $('#sClose').onclick=closeSheet;
  $('#sNot').onclick=()=>{if(perm!=='granted')askNotify()};
  $('#sExp').onclick=async()=>{
    const name='organizer-backup-'+today()+'.json';
    const file=new File([JSON.stringify(db,null,1)],name,{type:'application/json'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  };
  $('#sImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.events)||!Array.isArray(d.tx)||!Array.isArray(d.notes))throw 0;
      if(!confirm('Замінити поточні дані даними з копії?'))return;
      db={events:d.events,tx:d.tx,notes:d.notes};save();closeSheet();renderAll();toast('Дані відновлено')}catch(err){toast('Це не схоже на файл резервної копії')}};
    r.readAsText(f)};
});

function renderAll(){renderCal();renderBud();renderNotes()}
renderAll();
checkReminders(false);
setInterval(()=>{checkReminders(false);if(sel===today())renderCal()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders(false);renderCal()}});

if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
